# ============================================================
# laSolutions - Cloudflare Workers (OpenNext adapter)
# La app vive en /web. El adapter genera .open-next/worker.js
# + .open-next/assets/ a partir del build de Next.js.
# ============================================================

name = "lasolutions-website"
main = ".open-next/worker.js"
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true