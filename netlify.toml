# ============================================================
# laSolutions - Netlify configuration (Next.js app)
# La app vive en /web (Next.js 16, App Router)
# ============================================================

[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

# Netlify Next.js runtime (construye y sirve la app Next)
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "24"

# Headers de seguridad (refuerzo; la app tambien los envia desde next.config.ts)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://qyyyeiyjqwsfaqwazfgb.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Cache: assets de Next inmutables (chunks con hash)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache: imagenes publicas
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"