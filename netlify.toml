# ============================================================
# laSolutions - Netlify configuration (Next.js app)
# La app vive en /web (Next.js 16, App Router)
# ============================================================

[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

# Netlify Next.js runtime (construye y sirve la app Next)
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "24"

# Headers de seguridad (refuerzo; la CSP la emite el middleware de Next con nonces,
# un segundo header CSP en esta capa romperia la interseccion de policies)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache: assets de Next inmutables (chunks con hash)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache: imagenes publicas
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"