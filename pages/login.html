<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicia sesion en tu cuenta laSolutions.">
  <title>Iniciar sesion - laSolutions</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-logo">la<span>Solutions</span></a>
      <button class="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu">
        <li><a href="../index.html" class="nav-link">Inicio</a></li>
        <li><a href="catalog.html" class="nav-link">Catalogo</a></li>
        <li><a href="promotions.html" class="nav-link">Promociones</a></li>
        <li><a href="contact.html" class="nav-link">Contacto</a></li>
        <li><a href="about.html" class="nav-link">Sobre Nosotros</a></li>
      </ul>
      <div class="nav-actions" id="nav-auth">
        <a href="login.html" class="btn btn-sm btn-outline">Iniciar sesion</a>
        <a href="register.html" class="btn btn-sm btn-primary">Registrarse</a>
      </div>
    </div>
  </nav>

  <!-- Auth Wrapper -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <h2>Iniciar sesion</h2>
      <p class="auth-subtitle">Ingresa a tu cuenta laSolutions</p>

      <div class="alert alert-success" id="login-success"></div>
      <div class="alert alert-error" id="login-error"></div>

      <form id="login-form" novalidate>
        <div class="form-group" id="fg-email">
          <label for="email">Correo electronico</label>
          <input type="email" id="email" placeholder="tu@email.com" required>
          <div class="error-msg">Ingresa un correo valido.</div>
        </div>

        <div class="form-group" id="fg-password">
          <label for="password">Contrasena</label>
          <input type="password" id="password" placeholder="Tu contrasena" required>
          <div class="error-msg">La contrasena es requerida.</div>
        </div>

        <div class="form-row">
          <div class="form-checkbox">
            <input type="checkbox" id="remember">
            <label for="remember">Recordarme</label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary auth-submit">Iniciar sesion</button>
      </form>

      <div class="auth-footer">
        No tienes cuenta? <a href="register.html">Registrate aqui</a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Redirect if already logged in
      if (isLoggedIn()) {
        window.location.href = '../index.html';
        return;
      }

      var form = document.getElementById('login-form');
      var successAlert = document.getElementById('login-success');
      var errorAlert = document.getElementById('login-error');

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        // Reset
        successAlert.classList.remove('show');
        errorAlert.classList.remove('show');
        document.querySelectorAll('.form-group').forEach(function (fg) { fg.classList.remove('error'); });

        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;

        // Validate
        var valid = true;
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          document.getElementById('fg-email').classList.add('error');
          valid = false;
        }
        if (!password) {
          document.getElementById('fg-password').classList.add('error');
          valid = false;
        }
        if (!valid) return;

        var result = login(email, password);
        if (result.success) {
          successAlert.textContent = result.message;
          successAlert.classList.add('show');
          setTimeout(function () {
            window.location.href = '../index.html';
          }, 1000);
        } else {
          errorAlert.textContent = result.message;
          errorAlert.classList.add('show');
        }
      });
    });
  </script>

</body>
</html>
